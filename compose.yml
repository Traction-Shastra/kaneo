services:
  postgres:
    image: postgres:16-alpine
    container_name: kaneo-postgres

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - kaneo-internal


  kaneo:
    image: ghcr.io/usekaneo/kaneo:latest
    container_name: kaneo

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    networks:
      - kaneo-internal
      - web


volumes:
  postgres_data:


networks:
  kaneo-internal:
    driver: bridge

  web:
    external: true
